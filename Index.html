<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Messenger</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #007bff; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--card); width: 100%; max-width: 400px; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Auth Screen */
        .auth-screen { display: flex; flex-direction: column; justify-content: center; padding: 30px; height: 100%; }
        input { background: #2c2c2c; border: none; padding: 15px; color: white; border-radius: 8px; margin-bottom: 10px; width: 100%; }
        .btn { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Dashboard Screen */
        #dashboard { display: none; flex-direction: column; height: 100%; }
        .header { background: var(--primary); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-item { background: #2c2c2c; padding: 15px; margin-bottom: 8px; border-radius: 10px; display: flex; align-items: center; cursor: pointer; }
        .contact-item:hover { background: #383838; }
        
        /* Chat Area */
        .chat-screen { display: none; flex-direction: column; height: 100%; background: #000; }
        .msg-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; }
        .sent { background: var(--primary); align-self: flex-end; }
        .received { background: #333; align-self: flex-start; }
        
        .footer { padding: 10px; display: flex; gap: 5px; background: #1e1e1e; }
        #call-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 100%; height: 80%; object-fit: cover; }
    </style>
</head>
<body>

<div class="card">
    <!-- Auth Section -->
    <div id="auth" class="auth-screen">
        <h2 style="margin-bottom: 20px; text-align: center;">Global Messenger</h2>
        <input type="tel" id="phoneInput">
        <input type="password" id="passInput" placeholder="Password">
        <button class="btn" onclick="handleAuth()">Login / Register</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <div class="header">
            <span>Global Messenger</span>
            <button onclick="logout()" style="background:none; border:none; color:white;"><i class="fas fa-sign-out-alt"></i></button>
        </div>
        <div style="padding: 10px;">
            <input type="tel" id="targetPhone" placeholder="Enter number to chat">
            <button class="btn" onclick="addContact()">Start Chat</button>
        </div>
        <div class="chat-list" id="inboxList"></div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="chat-screen">
        <div class="header">
            <button onclick="closeChat()" style="background:none; border:none; color:white;"><i class="fas fa-arrow-left"></i></button>
            <span id="chatTitle">User</span>
            <button onclick="startCall()" style="background:none; border:none; color:white;"><i class="fas fa-video"></i></button>
        </div>
        <div class="msg-area" id="msgArea"></div>
        <div class="footer">
            <input type="text" id="msgInput" placeholder="Message...">
            <button class="btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
<script>
    const firebaseConfig = { databaseURL: "https://global-messenger-a8719-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const phoneInput = window.intlTelInput(document.querySelector("#phoneInput"), { preferredCountries: ["bd"], separateDialCode: true });
    
    let currentUser = localStorage.getItem("gm_user");
    let currentChat = "";

    window.onload = () => {
        if (currentUser) showDashboard();
    };

    function handleAuth() {
        const phone = phoneInput.getNumber().replace(/[^0-9]/g, '');
        const pass = document.getElementById("passInput").value;
        if (!phone || !pass) return alert("Enter phone & password");

        db.ref("users/" + phone).once("value", snap => {
            if (snap.exists()) {
                if (snap.val().pass === pass) {
                    saveSession(phone);
                } else { alert("Wrong Password"); }
            } else {
                db.ref("users/" + phone).set({ pass: pass });
                saveSession(phone);
            }
        });
    }

    function saveSession(phone) {
        localStorage.setItem("gm_user", phone);
        currentUser = phone;
        showDashboard();
    }

    function showDashboard() {
        document.getElementById("auth").style.display = "none";
        document.getElementById("dashboard").style.display = "flex";
        loadContacts();
    }

    function loadContacts() {
        db.ref("inbox/" + currentUser).on("value", snap => {
            const list = document.getElementById("inboxList");
            list.innerHTML = "";
            snap.forEach(child => {
                const div = document.createElement("div");
                div.className = "contact-item";
                div.innerText = "+" + child.key;
                div.onclick = () => openChat(child.key);
                list.appendChild(div);
            });
        });
    }

    function addContact() {
        const target = document.getElementById("targetPhone").value.replace(/[^0-9]/g, '');
        if(!target) return;
        db.ref("inbox/" + currentUser + "/" + target).set(true);
        db.ref("inbox/" + target + "/" + currentUser).set(true);
        openChat(target);
    }

    function openChat(target) {
        currentChat = target;
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("chatScreen").style.display = "flex";
        document.getElementById("chatTitle").innerText = "+" + target;
        
        db.ref("chats/" + [currentUser, target].sort().join("_")).on("child_added", snap => {
            const data = snap.val();
            const div = document.createElement("div");
            div.className = "msg " + (data.from == currentUser ? "sent" : "received");
            div.innerText = data.text;
            document.getElementById("msgArea").appendChild(div);
        });
    }

    function sendMsg() {
        const text = document.getElementById("msgInput").value;
        if(!text) return;
        db.ref("chats/" + [currentUser, currentChat].sort().join("_")).push({ from: currentUser, text: text });
        document.getElementById("msgInput").value = "";
    }

    function closeChat() {
        document.getElementById("chatScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "flex";
    }

    function logout() {
        localStorage.removeItem("gm_user");
        location.reload();
    }
</script>
</body>
</html>
