<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root { 
            --primary: #007bff; 
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            --card: rgba(30, 30, 30, 0.95); 
            --text: #e0e0e0; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-gradient); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .card { background: var(--card); backdrop-filter: blur(10px); width: 100%; max-width: 450px; height: 100%; display: flex; flex-direction: column; position: relative; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .auth-screen { display: flex; flex-direction: column; justify-content: center; padding: 25px; height: 100%; overflow-y: auto; }
        
        input, select { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px; color: white; border-radius: 12px; margin-bottom: 10px; width: 100%; outline: none; font-size: 14px; }
        input:focus, select:focus { border-color: #38bdf8; }
        select option { background: #222; color: #fff; }
        
        .password-container { position: relative; width: 100%; }
        .password-container input { padding-right: 45px; }
        .toggle-password { position: absolute; right: 15px; top: 15px; color: #aaa; cursor: pointer; font-size: 16px; z-index: 5; }
        .toggle-password:hover { color: #38bdf8; }

        .date-label { font-size: 12px; color: #aaa; margin-bottom: 4px; display: block; }

        .phone-container { display: flex; gap: 10px; }
        .phone-container select { width: 40%; }
        .phone-container input { width: 60%; }

        .btn { background: linear-gradient(135deg, #007bff, #00d2ff); color: white; padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        
        #dashboard, #chatScreen, #callScreen { display: none; flex-direction: column; height: 100%; }
        
        .header { background: linear-gradient(135deg, #007bff, #0056b3); padding: 15px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .user-profile-badge { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-profile-badge i { font-size: 24px; color: #fff; }
        .user-profile-badge span { font-weight: bold; font-size: 16px; }

        .navigation-tabs { display: flex; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-tab { flex: 1; padding: 14px; text-align: center; color: #888; cursor: pointer; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .nav-tab.active { color: #38bdf8; border-bottom: 3px solid #38bdf8; background: rgba(255,255,255,0.05); }

        .list-container { flex: 1; overflow-y: auto; padding: 12px; }

        .contact-item { background: rgba(255, 255, 255, 0.05); padding: 12px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .contact-info { display: flex; align-items: center; gap: 12px; }
        .contact-item i.avatar { color: #38bdf8; font-size: 26px; }

        .friend-count-badge { background: rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 10px 12px 0 12px; color: #38bdf8; display: flex; justify-content: space-between; }
        
        .msg-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; margin-bottom: 10px; word-break: break-word; font-size: 14px; }
        .sender-name { font-size: 10px; color: #38bdf8; margin-bottom: 3px; font-weight: bold; }
        .sent { background: linear-gradient(135deg, #007bff, #0056b3); align-self: flex-end; border-bottom-right-radius: 2px; }
        .received { background: rgba(255, 255, 255, 0.15); align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .chat-footer { padding: 10px; display: flex; gap: 6px; background: #1a1a1a; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); }
        .attach-btn { background: rgba(255,255,255,0.1); border: none; color: #38bdf8; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 16px; width: 85%; max-width: 380px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .profile-icon-lg { font-size: 55px; color: #38bdf8; margin-bottom: 10px; }
        .profile-info-box { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin: 8px 0; text-align: left; font-size: 13px; }
        .privacy-tag { font-size: 11px; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
        .privacy-private { background: rgba(255, 59, 48, 0.2); color: #ff453a; }
        .privacy-public { background: rgba(52, 199, 89, 0.2); color: #30d158; }
    </style>
</head>
<body>

<div class="card">
    <!-- Auth Screen -->
    <div id="auth" class="auth-screen">
        <h2 id="authTitle" style="text-align: center; color: #38bdf8; margin-bottom: 15px;">Sign Up</h2>
        
        <div id="regInputs">
            <input type="text" id="fname" placeholder="First Name">
            <input type="text" id="lname" placeholder="Last Name">
            <label class="date-label">Date of Birth</label>
            <input type="date" id="dob">
            
            <label class="date-label">Security Question (Password Recovery-এর জন্য)</label>
            <select id="secQuestion">
                <option value="school">What was your first school name?</option>
                <option value="pet">What is your favorite pet's name?</option>
                <option value="city">In which city were you born?</option>
            </select>
            <input type="text" id="secAnswer" placeholder="Your Security Answer">
        </div>

        <div class="phone-container" id="phoneContainer">
            <select id="countryCode">
                <option value="+880">🇧🇩 Bangladesh (+880)</option>
                <option value="+966">🇸🇦 Saudi Arabia (+966)</option>
                <option value="+971">🇦🇪 UAE (+971)</option>
                <option value="+91">🇮🇳 India (+91)</option>
                <option value="+92">🇵🇰 Pakistan (+92)</option>
                <option value="+1">🇺🇸 USA (+1)</option>
            </select>
            <input type="tel" id="phoneInput" placeholder="Phone Number">
        </div>
        
        <div class="password-container">
            <input type="password" id="passInput" placeholder="Password">
            <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('passInput', this)"></i>
        </div>

        <div id="confirmPassBox" class="password-container">
            <input type="password" id="confirmPassInput" placeholder="Confirm Password">
            <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassInput', this)"></i>
        </div>
        
        <button class="btn" id="mainBtn" onclick="handleAuth()" style="margin-top: 10px;">Sign Up</button>

        <p id="forgotPassLink" style="text-align: center; margin-top: 12px; font-size: 13px; display: none;">
            <a href="javascript:void(0)" onclick="openForgotModal()" style="color: #38bdf8; text-decoration: none;">Forgot Password?</a>
        </p>

        <p style="text-align: center; margin-top: 12px; font-size: 14px; cursor: pointer;" onclick="toggleMode()">
            <span id="toggleText">Already have an account?</span> <b id="toggleBtn" style="color: #38bdf8;">Login</b>
        </p>
    </div>

    <!-- Forgot Password Modal (নিরাপদ ভেরিফিকেশন সহ) -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <i class="fas fa-shield-alt profile-icon-lg"></i>
            <h3 style="color:#fff; margin-bottom:10px;">Security Verification</h3>
            
            <div class="phone-container" style="margin-bottom: 8px;">
                <select id="resetCountryCode">
                    <option value="+880">🇧🇩 (+880)</option>
                    <option value="+966">🇸🇦 (+966)</option>
                    <option value="+971">🇦🇪 (+971)</option>
                </select>
                <input type="tel" id="resetPhone" placeholder="Registered Phone">
            </div>

            <input type="date" id="resetDob">
            
            <select id="resetSecQuestion">
                <option value="school">What was your first school name?</option>
                <option value="pet">What is your favorite pet's name?</option>
                <option value="city">In which city were you born?</option>
            </select>
            <input type="text" id="resetSecAnswer" placeholder="Your Security Answer">

            <div class="password-container">
                <input type="password" id="newPassInput" placeholder="New Password">
                <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('newPassInput', this)"></i>
            </div>

            <button class="btn" onclick="handleResetPassword()" style="margin-top:10px;">Reset Password</button>
            <button class="btn" onclick="closeForgotModal()" style="margin-top:8px; background: rgba(255,255,255,0.1); color:#ccc;">Cancel</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <div class="header">
            <div class="user-profile-badge" onclick="openProfileModal(currentUserPhone, true)">
                <i class="fas fa-user-circle"></i>
                <span id="displayUserName">Loading...</span>
            </div>
            <button onclick="logout()" style="background:none; border:none; color:white; cursor:pointer;" title="Logout"><i class="fas fa-sign-out-alt" style="font-size:18px;"></i></button>
        </div>

        <div class="navigation-tabs">
            <div class="nav-tab active" id="tabChatsBtn" onclick="switchMainTab('chats')">
                <i class="fas fa-comments"></i> CHATS
            </div>
            <div class="nav-tab" id="tabGroupsBtn" onclick="switchMainTab('groups')">
                <i class="fas fa-users"></i> GROUPS
            </div>
        </div>

        <div id="tabChats" style="display:flex; flex-direction:column; flex:1;">
            <div style="padding: 12px 12px 0 12px;">
                <input type="tel" id="targetPhone" placeholder="Friend's Number (e.g. +88017...)">
                <button class="btn" onclick="addContact()">Add / Chat Friend</button>
            </div>
            <div class="friend-count-badge">
                <span>Friends List</span>
                <strong id="friendCount">0</strong>
            </div>
            <div class="list-container" id="inboxList"></div>
        </div>

        <div id="tabGroups" style="display:none; flex-direction:column; flex:1;">
            <div style="padding: 12px 12px 0 12px;">
                <input type="text" id="groupNameInput" placeholder="New Group Name">
                <button class="btn" onclick="createGroup()">Create Group</button>
            </div>
            <div class="list-container" id="groupList"></div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen">
        <div class="header">
            <button onclick="closeChat()" style="background:none; border:none; color:white;"><i class="fas fa-arrow-left"></i></button>
            <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" onclick="openProfileModal(activeChatTarget, false)">
                <i class="fas fa-user-circle" id="chatIcon"></i>
                <span id="chatTitle" style="font-weight:bold;">User</span>
            </div>
            <div></div>
        </div>
        
        <div class="msg-area" id="msgArea"></div>

        <div class="chat-footer">
            <input type="text" id="msgInput" placeholder="Message..." style="margin-bottom:0;">
            <button class="btn" style="width: auto; padding: 12px 16px;" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Profile View Modal (নিজের এবং বন্ধুদের জন্য) -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <i class="fas fa-user-circle profile-icon-lg"></i>
            <h3 id="modalUserName" style="color:#fff;">Loading...</h3>
            
            <div class="profile-info-box">
                <span style="color:#aaa; font-size:11px; display:block;">PHONE NUMBER:</span>
                <strong id="modalUserPhone" style="color:#38bdf8; font-size:14px;">...</strong>
            </div>

            <!-- পাবলিক/প্রাইভেট ডাটা সেকশন -->
            <div class="profile-info-box" id="modalExtraDataBox">
                <span style="color:#aaa; font-size:11px; display:block;">ADDITIONAL DATA:</span>
                <div id="modalExtraContent" style="color:#ddd; margin-top:4px;">Private</div>
            </div>

            <!-- ইউজার নিজের প্রোফাইল দেখলে পাবলিশ/হাইড টগল বাটন পাবে -->
            <div id="selfPrivacyControls" style="display:none; margin-top:10px;">
                <label style="font-size:12px; color:#aaa;">Public Data Visibility:</label>
                <button class="btn" id="privacyToggleBtn" onclick="toggleDataPrivacy()" style="background:#333; margin-top:5px; font-size:12px;">Toggle Visibility</button>
            </div>

            <div id="friendChatAction" style="display:none; margin-top:10px;">
                <button class="btn" onclick="startDirectChatFromProfile()">Start Chat</button>
            </div>

            <button class="btn" onclick="closeProfileModal()" style="margin-top:10px; background: rgba(255,255,255,0.1); color:#ccc;">Close</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { 
        databaseURL: "https://global-messenger-a8719-default-rtdb.firebaseio.com/",
        storageBucket: "global-messenger-a8719.appspot.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLoginMode = false;
    let currentUserPhone = "";
    let activeChatTarget = "";
    let viewingProfilePhone = "";
    let currentSelfIsPublic = false;

    function togglePasswordVisibility(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById("authTitle").innerText = isLoginMode ? "Login" : "Sign Up";
        document.getElementById("mainBtn").innerText = isLoginMode ? "Login" : "Sign Up";
        document.getElementById("regInputs").style.display = isLoginMode ? "none" : "block";
        document.getElementById("confirmPassBox").style.display = isLoginMode ? "none" : "block";
        document.getElementById("forgotPassLink").style.display = isLoginMode ? "block" : "none";
    }

    function handleAuth() {
        const phoneRaw = document.getElementById("phoneInput").value.replace(/[^0-9]/g, '');
        const countryCode = document.getElementById("countryCode").value;
        const fullPhone = countryCode + phoneRaw; 

        if(!phoneRaw) return alert("Enter phone number!");

        if (isLoginMode) {
            const pass = document.getElementById("passInput").value;
            db.ref("users/" + fullPhone).once("value", snap => {
                if (snap.exists() && snap.val().pass === pass) {
                    saveSession(fullPhone);
                } else {
                    alert("Invalid phone or password!");
                }
            });
        } else {
            const fname = document.getElementById("fname").value.trim();
            const lname = document.getElementById("lname").value.trim();
            const dob = document.getElementById("dob").value;
            const secQuestion = document.getElementById("secQuestion").value;
            const secAnswer = document.getElementById("secAnswer").value.trim().toLowerCase();
            const pass = document.getElementById("passInput").value;
            const confirmPass = document.getElementById("confirmPassInput").value;

            if(!fname || !lname) return alert("Please enter full name!");
            if (!dob) return alert("Please select Date of Birth!");
            if (!secAnswer) return alert("Please answer security question!");
            if (pass !== confirmPass) return alert("Passwords do not match!");

            const fullName = fname + " " + lname;

            db.ref("users/" + fullPhone).once("value", snap => {
                if (snap.exists()) {
                    alert("Account already exists with this number!");
                } else {
                    db.ref("users/" + fullPhone).set({ 
                        name: fullName, 
                        dob: dob, 
                        secQ: secQuestion, 
                        secA: secAnswer, 
                        pass: pass,
                        isPublic: false
                    }).then(() => saveSession(fullPhone));
                }
            });
        }
    }

    function openForgotModal() { document.getElementById("forgotModal").style.display = "flex"; }
    function closeForgotModal() { document.getElementById("forgotModal").style.display = "none"; }

    function handleResetPassword() {
        const phoneRaw = document.getElementById("resetPhone").value.replace(/[^0-9]/g, '');
        const countryCode = document.getElementById("resetCountryCode").value;
        const fullPhone = countryCode + phoneRaw;
        const dobInput = document.getElementById("resetDob").value;
        const secQ = document.getElementById("resetSecQuestion").value;
        const secA = document.getElementById("resetSecAnswer").value.trim().toLowerCase();
        const newPass = document.getElementById("newPassInput").value;

        if (!phoneRaw || !dobInput || !secA || !newPass) {
            return alert("All fields are required!");
        }

        db.ref("users/" + fullPhone).once("value", snap => {
            if (snap.exists()) {
                const uData = snap.val();
                if (uData.dob === dobInput && uData.secQ === secQ && uData.secA === secA) {
                    db.ref("users/" + fullPhone + "/pass").set(newPass).then(() => {
                        alert("Password reset successfully! Please login.");
                        closeForgotModal();
                    });
                } else {
                    alert("Verification details (DOB or Security Answer) failed!");
                }
            } else {
                alert("Phone number not registered!");
            }
        });
    }

    function saveSession(phone) { 
        localStorage.setItem("gm_user", phone); 
        currentUserPhone = phone;
        showDashboard(); 
    }
    
    function showDashboard() { 
        currentUserPhone = localStorage.getItem("gm_user");
        document.getElementById("auth").style.display = "none"; 
        document.getElementById("dashboard").style.display = "flex"; 
        loadUserProfile();
        loadContacts(); 
        loadGroups(); 
    }

    /* নিজের প্রোফাইল নেম ড্যাশবোর্ডে লোড করা */
    function loadUserProfile() {
        db.ref("users/" + currentUserPhone).on("value", snap => {
            if(snap.exists()) {
                const uData = snap.val();
                document.getElementById("displayUserName").innerText = uData.name || currentUserPhone;
                currentSelfIsPublic = uData.isPublic || false;
            }
        });
    }

    /* ফ্রেন্ডলিস্ট তৈরি ও ফ্রেন্ডের আসল নাম ডাটাবেজ থেকে লোড করা */
    function loadContacts() { 
        db.ref("inbox/" + currentUserPhone).on("value", snap => { 
            const list = document.getElementById("inboxList"); 
            list.innerHTML = ""; 
            let count = 0;
            snap.forEach(child => { 
                count++;
                const friendPhone = child.key;
                const div = document.createElement("div"); 
                div.className = "contact-item"; 
                
                db.ref("users/" + friendPhone).once("value", uSnap => {
                    const friendName = (uSnap.exists() && uSnap.val().name) ? uSnap.val().name : friendPhone;
                    div.innerHTML = `
                        <div class="contact-info">
                            <i class="fas fa-user-circle avatar"></i> 
                            <div>
                                <div style="font-weight:bold; font-size:15px; color:#fff;">${friendName}</div>
                                <div style="font-size:12px; color:#aaa;">${friendPhone}</div>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right" style="font-size:14px; color:#555;"></i>`;
                });

                /* ক্লিক করলে সরাসরি চ্যাটের বদলে তার প্রোফাইল অন হবে */
                div.onclick = () => openProfileModal(friendPhone, false); 
                list.appendChild(div); 
            }); 
            document.getElementById("friendCount").innerText = count;
        }); 
    }

    /* প্রোফাইল পপ-আপ (নিজের ও বন্ধুদের জন্য আলাদা ভিউ) */
    function openProfileModal(targetPhone, isSelf = false) {
        viewingProfilePhone = targetPhone;
        document.getElementById("profileModal").style.display = "flex";
        
        const selfControls = document.getElementById("selfPrivacyControls");
        const friendAction = document.getElementById("friendChatAction");

        if(isSelf || targetPhone === currentUserPhone) {
            selfControls.style.display = "block";
            friendAction.style.display = "none";
        } else {
            selfControls.style.display = "none";
            friendAction.style.display = "block";
        }

        db.ref("users/" + targetPhone).once("value", snap => {
            if(snap.exists()) {
                const uData = snap.val();
                document.getElementById("modalUserName").innerText = uData.name || "User";
                document.getElementById("modalUserPhone").innerText = targetPhone;

                const privacyBtn = document.getElementById("privacyToggleBtn");
                if (uData.isPublic) {
                    privacyBtn.innerText = "Public Data: ON (Click to Hide)";
                    privacyBtn.style.background = "#28a745";
                } else {
                    privacyBtn.innerText = "Public Data: OFF (Click to Show)";
                    privacyBtn.style.background = "#dc3545";
                }

                /* প্রাইভেসি ফিল্টারিং: অন্য কেউ প্রোফাইল দেখলে শর্তসাপেক্ষে ডাটা দেখাবে */
                const extraContent = document.getElementById("modalExtraContent");
                if(isSelf || targetPhone === currentUserPhone) {
                    extraContent.innerHTML = `<b>Date of Birth:</b> ${uData.dob || 'N/A'} <br><span class="privacy-tag ${uData.isPublic ? 'privacy-public':'privacy-private'}">${uData.isPublic ? 'Publicly Visible' : 'Private'}</span>`;
                } else {
                    if(uData.isPublic) {
                        extraContent.innerHTML = `<span style="color:#30d158;"><i class="fas fa-check-circle"></i> User details are public</span><br>Bio/Status: Member of Global Messenger`;
                    } else {
                        extraContent.innerHTML = `<span style="color:#ff453a;"><i class="fas fa-lock"></i> User details are set to Private</span>`;
                    }
                }
            }
        });
    }

    function toggleDataPrivacy() {
        const newStatus = !currentSelfIsPublic;
        db.ref("users/" + currentUserPhone + "/isPublic").set(newStatus).then(() => {
            currentSelfIsPublic = newStatus;
            openProfileModal(currentUserPhone, true);
        });
    }

    function startDirectChatFromProfile() {
        closeProfileModal();
        openChat(viewingProfilePhone, false);
    }

    function closeProfileModal() { document.getElementById("profileModal").style.display = "none"; }

    function addContact() { 
        const target = document.getElementById("targetPhone").value.trim(); 
        if(!target) return alert("Enter number!"); 
        db.ref("inbox/" + currentUserPhone + "/" + target).set(true); 
        db.ref("inbox/" + target + "/" + currentUserPhone).set(true); 
        document.getElementById("targetPhone").value = "";
        openProfileModal(target, false); 
    }

    function openChat(target, groupMode = false, groupTitle = "") { 
        activeChatTarget = target;
        document.getElementById("dashboard").style.display = "none"; 
        document.getElementById("chatScreen").style.display = "flex"; 
        
        if(groupMode) {
            document.getElementById("chatTitle").innerText = groupTitle;
        } else {
            db.ref("users/" + target).once("value", uSnap => {
                document.getElementById("chatTitle").innerText = (uSnap.exists() && uSnap.val().name) ? uSnap.val().name : target;
            });
        }
        
        document.getElementById("msgArea").innerHTML = "";
        const path = groupMode ? "group_chats/" + target : "chats/" + [currentUserPhone, target].sort().join("_");
        
        db.ref(path).off();
        db.ref(path).on("child_added", snap => { 
            renderMessage(snap.val());
        }); 
    }

    function renderMessage(data) {
        const div = document.createElement("div"); 
        div.className = "msg " + (data.from == currentUserPhone ? "sent" : "received");
        div.innerHTML = `<div>${data.text}</div>`;
        const area = document.getElementById("msgArea");
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    function sendMsg() { 
        const text = document.getElementById("msgInput").value; 
        if(!text) return;
        const path = "chats/" + [currentUserPhone, activeChatTarget].sort().join("_");
        db.ref(path).push({ from: currentUserPhone, text: text });
        document.getElementById("msgInput").value = ""; 
    }

    function switchMainTab(selectedTab) {
        document.getElementById("tabChats").style.display = selectedTab === 'chats' ? 'flex' : 'none';
        document.getElementById("tabGroups").style.display = selectedTab === 'groups' ? 'flex' : 'none';
        document.getElementById("tabChatsBtn").classList.toggle("active", selectedTab === 'chats');
        document.getElementById("tabGroupsBtn").classList.toggle("active", selectedTab === 'groups');
    }

    function createGroup() {
        const name = document.getElementById("groupNameInput").value.trim();
        if(!name) return alert("Enter Group Name!");
        const groupId = "group_" + Date.now();
        db.ref("groups/" + groupId).set({ name: name });
        document.getElementById("groupNameInput").value = "";
    }

    function loadGroups() {
        db.ref("groups").on("value", snap => {
            const list = document.getElementById("groupList");
            list.innerHTML = "";
            snap.forEach(child => {
                const gData = child.val();
                const div = document.createElement("div");
                div.className = "contact-item";
                div.innerHTML = `<div class="contact-info"><i class="fas fa-users" style="color:#00d2ff;"></i> <span>${gData.name}</span></div>`;
                div.onclick = () => openChat(child.key, true, gData.name);
                list.appendChild(div);
            });
        });
    }

    function logout() { localStorage.removeItem("gm_user"); location.reload(); }
    function closeChat() { document.getElementById("chatScreen").style.display = "none"; document.getElementById("dashboard").style.display = "flex"; }
    
    window.onload = () => { 
        if(localStorage.getItem("gm_user")) {
            currentUserPhone = localStorage.getItem("gm_user");
            showDashboard(); 
        }
    };
</script>
</body>
</html>
