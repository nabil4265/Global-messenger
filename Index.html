<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Free Messenger</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #111827; border: 1px solid #1f2937; padding: 24px; border-radius: 16px; width: 100%; max-width: 480px; position: relative; }
        .lang-switch { position: absolute; top: 18px; right: 18px; }
        .lang-switch select { background: #1f2937; color: #38bdf8; border: 1px solid #374151; padding: 5px; border-radius: 6px; }
        .auth-box { text-align: center; margin-top: 20px; }
        .auth-box h2 { color: #38bdf8; margin-bottom: 8px; }
        .auth-box p { color: #9ca3af; font-size: 13px; margin-bottom: 24px; }
        .iti { width: 100%; color: #000; margin-bottom: 16px; }
        button { padding: 10px 16px; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .app-dashboard { display: none; flex-direction: column; height: 550px; margin-top: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 12px; margin-bottom: 12px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-box input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white; }
        .inbox-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid #1f2937; }
        .inbox-item { background: #1f2937; padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #38bdf8; cursor: pointer; }
        .inbox-item.active { background: #0284c7; color: white; }
        .chat-area { display: flex; flex-direction: column; flex: 1; }
        .active-user-bar { background: #1f2937; padding: 10px; border-radius: 8px; font-size: 13px; color: #38bdf8; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .messages-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #030712; border-radius: 8px; }
        .msg { max-width: 75%; padding: 10px; border-radius: 12px; font-size: 14px; }
        .msg.sent { background: #0284c7; align-self: flex-end; }
        .msg.received { background: #1f2937; align-self: flex-start; }
        .chat-input { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white; }
        .call-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.98); border-radius: 16px; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; bottom: 80px; right: 15px; width: 100px; height: 130px; border-radius: 8px; border: 2px solid #38bdf8; }
        .call-controls { position: absolute; bottom: 20px; display: flex; gap: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="lang-switch">
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en" selected>English</option>
                <option value="bn">বাংলা</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>

        <div id="authSection" class="auth-box">
            <h2>AnNabil Messenger</h2>
            <p>Free Messaging & Video Calls</p>
            <input type="tel" id="phoneInput">
            <button id="btnLogin" onclick="loginUser()" style="width: 100%; margin-top: 15px;">Login</button>
        </div>

        <div id="dashboardSection" class="app-dashboard">
            <div class="header">
                <div>
                    <span style="font-size: 11px; color: #9ca3af;">My ID:</span>
                    <strong id="userDisplay" style="color: #38bdf8; display: block;"></strong>
                </div>
                <button onclick="logout()" style="background: #ef4444; font-size: 12px;">Logout</button>
            </div>

            <div class="search-box">
                <input type="text" id="targetPhone" placeholder="Enter ID/Number...">
                <button onclick="startChatWithTarget()"><i class="fa-solid fa-user-plus"></i></button>
            </div>

            <div class="inbox-list" id="inboxList"></div>

            <div class="chat-area">
                <div class="active-user-bar">
                    <span id="activeUserTitle">Select a user</span>
                    <div id="callBtnGroup" style="display: none; gap: 6px;">
                        <button onclick="initiateCall(false)" style="background:#10b981;"><i class="fa-solid fa-phone"></i></button>
                        <button onclick="initiateCall(true)" style="background:#8b5cf6;"><i class="fa-solid fa-video"></i></button>
                    </div>
                </div>
                <div class="messages-list" id="messagesList"></div>
                <div class="chat-input">
                    <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
                    <button onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="callModal" class="call-modal">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="call-controls">
                <button id="btnAcceptCall" onclick="acceptCall()" style="background:#10b981; display:none;">Accept</button>
                <button onclick="endCall()" style="background:#ef4444;">End Call</button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = "en"; // ডিফল্ট ভাষা ইংরেজি
        let currentUserNumber = "";
        let selectedTargetNumber = "";
        let currentChatRoomId = "";
        let localStream, peerConnection, currentCallRef;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const phoneField = document.querySelector("#phoneInput");
        const iti = window.intlTelInput(phoneField, { preferredCountries: ["us", "sa", "bd"], utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js" });

        const firebaseConfig = {
            databaseURL: "YOUR_FIREBASE_DATABASE_URL_HERE" 
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        function changeLanguage(lang) {
            currentLang = lang;
            // এখানে আপনি চাইলে আরও ভাষা পরিবর্তন লজিক যোগ করতে পারেন
        }

        function loginUser() {
            if (iti.isValidNumber()) {
                currentUserNumber = iti.getNumber().replace(/[^0-9]/g, '');
                document.getElementById("userDisplay").innerText = "+" + currentUserNumber;
                document.getElementById("authSection").style.display = "none";
                document.getElementById("dashboardSection").style.display = "flex";
                loadInbox();
                listenForIncomingCalls();
            } else { alert("Please enter a valid number!"); }
        }

        function openChatWith(targetNum) {
            selectedTargetNumber = "+" + targetNum;
            document.getElementById("activeUserTitle").innerText = "Chatting with: " + selectedTargetNumber;
            document.getElementById("callBtnGroup").style.display = "flex";
            const ids = [currentUserNumber, targetNum].sort();
            currentChatRoomId = `chat_${ids[0]}_${ids[1]}`;
            listenForPrivateMessages();
        }

        function startChatWithTarget() {
            let inputTarget = document.getElementById("targetPhone").value.trim().replace(/[^0-9]/g, '');
            if (inputTarget && inputTarget !== currentUserNumber) {
                openChatWith(inputTarget);
                db.ref(`user_inbox/${currentUserNumber}/${inputTarget}`).set(true);
                db.ref(`user_inbox/${inputTarget}/${currentUserNumber}`).set(true);
            }
        }

        function loadInbox() {
            db.ref(`user_inbox/${currentUserNumber}`).on('value', (snapshot) => {
                const inboxContainer = document.getElementById("inboxList");
                inboxContainer.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((childSnap) => {
                        const friendNum = childSnap.key;
                        const btn = document.createElement("div");
                        btn.className = "inbox-item";
                        btn.innerText = "+" + friendNum;
                        btn.onclick = () => openChatWith(friendNum);
                        inboxContainer.appendChild(btn);
                    });
                }
            });
        }

        function sendMsg() {
            const input = document.getElementById("msgInput");
            if (input.value.trim() && currentChatRoomId) {
                db.ref("private_chats/" + currentChatRoomId).push({ sender: currentUserNumber, message: input.value.trim(), timestamp: Date.now() });
                input.value = "";
            }
        }

        function listenForPrivateMessages() {
            const msgList = document.getElementById("messagesList");
            msgList.innerHTML = "";
            db.ref("private_chats/" + currentChatRoomId).off();
            db.ref("private_chats/" + currentChatRoomId).limitToLast(50).on("child_added", (snapshot) => {
                const data = snapshot.val();
                const isMe = data.sender === currentUserNumber;
                const msgDiv = document.createElement("div");
                msgDiv.className = `msg ${isMe ? 'sent' : 'received'}`;
                msgDiv.innerText = data.message;
                msgList.appendChild(msgDiv);
                msgList.scrollTop = msgList.scrollHeight;
            });
        }

        async function initiateCall(isVideo) {
            const targetNum = selectedTargetNumber.replace(/[^0-9]/g, '');
            currentCallRef = db.ref(`calls/${targetNum}`);
            document.getElementById("callModal").style.display = "flex";
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
            document.getElementById("localVideo").srcObject = localStream;
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = e => document.getElementById("remoteVideo").srcObject = e.streams[0];
            peerConnection.onicecandidate = e => e.candidate && currentCallRef.child('callerCandidates').push(e.candidate.toJSON());
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            await currentCallRef.set({ caller: currentUserNumber, isVideo: isVideo, offer: { type: offer.type, sdp: offer.sdp }, status: 'calling' });
            currentCallRef.on('value', async s => {
                const data = s.val();
                if (data && data.answer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
                if (!data) endCallUI();
            });
        }

        function listenForIncomingCalls() {
            db.ref(`calls/${currentUserNumber}`).on('value', async s => {
                const data = s.val();
                if (data && data.status === 'calling') {
                    currentCallRef = db.ref(`calls/${currentUserNumber}`);
                    document.getElementById("callModal").style.display = "flex";
                    document.getElementById("btnAcceptCall").style.display = "inline-flex";
                }
            });
        }

        async function acceptCall() {
            const s = await currentCallRef.once('value');
            const data = s.val();
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: data.isVideo });
            document.getElementById("localVideo").srcObject = localStream;
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = e => document.getElementById("remoteVideo").srcObject = e.streams[0];
            peerConnection.onicecandidate = e => e.candidate && currentCallRef.child('calleeCandidates').push(e.candidate.toJSON());
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await currentCallRef.update({ answer: { type: answer.type, sdp: answer.sdp }, status: 'connected' });
        }

        function endCall() { if (currentCallRef) currentCallRef.remove(); endCallUI(); }
        function endCallUI() {
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById("callModal").style.display = "none";
        }
        function handleEnter(e) { if (e.key === 'Enter') sendMsg(); }
        function logout() { location.reload(); }
    </script>
</body>
</html>
