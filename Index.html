<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { 
            --primary: #007bff; 
            /* দুটি কালারের সংমিশ্রণে প্রিমিয়াম গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            --card: rgba(30, 30, 30, 0.85); 
            --text: #e0e0e0; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .card { 
            background: var(--card); 
            backdrop-filter: blur(10px);
            width: 100%; 
            max-width: 400px; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
            position: relative; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .auth-screen { display: flex; flex-direction: column; justify-content: center; padding: 30px; height: 100%; overflow-y: auto; }
        
        input { 
            background: rgba(255, 255, 255, 0.07); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 14px; 
            color: white; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            width: 100%; 
            outline: none; 
            font-size: 14px; 
        }
        
        input:focus { border-color: #38bdf8; }
        label { font-size: 12px; color: #aaa; margin-bottom: 4px; display: block; }
        
        .btn { 
            background: linear-gradient(135deg, #007bff, #00d2ff); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            font-size: 16px; 
            transition: 0.3s;
        }
        
        .btn:hover { opacity: 0.9; }
        
        #dashboard, #chatScreen { display: none; flex-direction: column; height: 100%; }
        
        .header { 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .contact-item { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 15px; 
            margin-bottom: 8px; 
            border-radius: 10px; 
            cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.2s;
        }
        
        .contact-item:hover { background: rgba(255, 255, 255, 0.1); }
        
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; word-break: break-word; }
        .sent { background: linear-gradient(135deg, #007bff, #0056b3); align-self: flex-end; }
        .received { background: rgba(255, 255, 255, 0.15); align-self: flex-start; }
    </style>
</head>
<body>

<div class="card">
    <!-- Auth Section -->
    <div id="auth" class="auth-screen">
        <h2 id="authTitle" style="text-align: center; color: #38bdf8; margin-bottom: 20px;">Sign Up</h2>
        
        <div id="regInputs">
            <input type="text" id="fname" placeholder="First Name">
            <input type="text" id="lname" placeholder="Last Name">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob">
        </div>
        
        <input type="tel" id="phoneInput" placeholder="Phone Number (e.g. 88017...)">
        <input type="password" id="passInput" placeholder="Password">
        
        <div id="confirmPassBox">
            <input type="password" id="confirmPassInput" placeholder="Confirm Password">
        </div>
        
        <button class="btn" id="mainBtn" onclick="handleAuth()">Sign Up</button>
        <p style="text-align: center; margin-top: 20px; font-size: 14px; cursor: pointer;" onclick="toggleMode()">
            <span id="toggleText">Already have an account?</span> <b id="toggleBtn" style="color: #38bdf8;">Login</b>
        </p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <div class="header">
            <span>Global Messenger</span>
            <button onclick="logout()" style="background:none; border:none; color:white; font-size: 18px; cursor:pointer;"><i class="fas fa-sign-out-alt"></i></button>
        </div>
        <div style="padding: 10px;">
            <input type="tel" id="targetPhone" placeholder="Friend's Number">
            <button class="btn" onclick="addContact()">Start Chat</button>
        </div>
        <div style="flex:1; overflow-y:auto; padding: 10px;" id="inboxList"></div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen">
        <div class="header">
            <button onclick="closeChat()" style="background:none; border:none; color:white; font-size: 18px; cursor:pointer;"><i class="fas fa-arrow-left"></i></button>
            <span id="chatTitle">User</span>
            <span></span>
        </div>
        <div style="flex:1; overflow-y:auto; padding: 15px;" id="msgArea"></div>
        <div style="padding: 10px; display:flex; gap:5px;">
            <input type="text" id="msgInput" placeholder="Message..." style="margin-bottom:0;">
            <button class="btn" style="width: auto;" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://global-messenger-a8719-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLoginMode = false;
    
    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById("authTitle").innerText = isLoginMode ? "Login" : "Sign Up";
        document.getElementById("mainBtn").innerText = isLoginMode ? "Login" : "Sign Up";
        
        document.getElementById("regInputs").style.display = isLoginMode ? "none" : "block";
        document.getElementById("confirmPassBox").style.display = isLoginMode ? "none" : "block";
        
        document.getElementById("toggleText").innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
        document.getElementById("toggleBtn").innerText = isLoginMode ? "Sign Up" : "Login";
    }

    function handleAuth() {
        const fname = document.getElementById("fname").value.trim();
        const lname = document.getElementById("lname").value.trim();
        const dob = document.getElementById("dob").value;
        const phone = document.getElementById("phoneInput").value.replace(/[^0-9]/g, '');
        const pass = document.getElementById("passInput").value.trim();
        const confirmPass = document.getElementById("confirmPassInput").value.trim();

        if (isLoginMode) {
            if (!phone || !pass) return alert("Please enter both Phone Number and Password!");

            db.ref("users/" + phone).once("value", snap => {
                if (snap.exists() && snap.val().pass === pass) {
                    saveSession(phone);
                } else {
                    alert("Invalid phone or password!");
                }
            });
        } else {
            if (!phone || !pass || !confirmPass || !fname || !lname || !dob) {
                return alert("Please fill all required fields!");
            }

            if (pass !== confirmPass) {
                return alert("Passwords do not match! Please check again.");
            }

            db.ref("users/" + phone).once("value", snap => {
                if (snap.exists()) {
                    alert("Account already exists with this number! Please Login.");
                } else {
                    db.ref("users/" + phone).set({ 
                        firstName: fname, 
                        lastName: lname, 
                        dob: dob,
                        pass: pass 
                    }).then(() => {
                        saveSession(phone);
                    });
                }
            });
        }
    }

    function saveSession(phone) { localStorage.setItem("gm_user", phone); showDashboard(); }
    function showDashboard() { document.getElementById("auth").style.display = "none"; document.getElementById("dashboard").style.display = "flex"; loadContacts(); }
    
    function loadContacts() {
        const user = localStorage.getItem("gm_user");
        db.ref("inbox/" + user).on("value", snap => {
            const list = document.getElementById("inboxList"); list.innerHTML = "";
            snap.forEach(child => {
                const div = document.createElement("div"); div.className = "contact-item"; div.innerText = "+" + child.key;
                div.onclick = () => openChat(child.key); list.appendChild(div);
            });
        });
    }

    function addContact() {
        const user = localStorage.getItem("gm_user");
        const target = document.getElementById("targetPhone").value.replace(/[^0-9]/g, '');
        if(!target) return alert("Enter friend's number!");
        db.ref("inbox/" + user + "/" + target).set(true);
        db.ref("inbox/" + target + "/" + user).set(true);
        openChat(target);
    }

    function openChat(target) {
        const user = localStorage.getItem("gm_user");
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("chatScreen").style.display = "flex";
        document.getElementById("chatTitle").innerText = "+" + target;
        const roomId = [user, target].sort().join("_");
        db.ref("chats/" + roomId).off();
        db.ref("chats/" + roomId).on("child_added", snap => {
            const data = snap.val();
            const div = document.createElement("div"); div.className = "msg " + (data.from == user ? "sent" : "received");
            div.innerText = data.text;
            const area = document.getElementById("msgArea"); area.appendChild(div); area.scrollTop = area.scrollHeight;
        });
    }

    function sendMsg() {
        const user = localStorage.getItem("gm_user");
        const text = document.getElementById("msgInput").value;
        const target = document.getElementById("chatTitle").innerText.replace("+", "");
        if(!text) return;
        db.ref("chats/" + [user, target].sort().join("_")).push({ from: user, text: text });
        document.getElementById("msgInput").value = "";
    }
    
    function logout() { localStorage.removeItem("gm_user"); location.reload(); }
    function closeChat() { document.getElementById("chatScreen").style.display = "none"; document.getElementById("dashboard").style.display = "flex"; }
    window.onload = () => { if(localStorage.getItem("gm_user")) showDashboard(); };
</script>
</body>
</html>
